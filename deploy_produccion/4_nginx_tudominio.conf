server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    client_max_body_size 100M;
    client_body_timeout 120s;

    access_log /var/log/corejs/nginx-access.log;
    error_log  /var/log/corejs/nginx-error.log;

    root /var/www/corejs/frontend_dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        client_max_body_size 100M;
    }

    location /api/uploads/ {
        alias /var/www/corejs/apps/backend/uploads/;
        add_header Cache-Control "public, max-age=86400, immutable";
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location /api/docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
    location ~ /(package\.json|tsconfig|nest-cli|vite\.config|env|\.log)$ { deny all; }
}
